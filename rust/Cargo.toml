[package]
name = "carbon-stack"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
hex = "=0.4.3"
regex = "=1.12.3"
globset = "=0.4.18"
oxc_allocator = "=0.133.0"
oxc_ast = "=0.133.0"
oxc_ast_visit = "=0.133.0"
oxc_parser = { version = "=0.133.0", default-features = false }
oxc_span = "=0.133.0"

[profile.release]
strip = true
